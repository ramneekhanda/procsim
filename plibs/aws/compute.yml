imports:
  - from: "plibs:themes/cloud"

graph_defn:
  icons:
    - id: aws_lambda
      url: "icons/aws/Lambda.png"
    - id: aws_ec2
      url: "icons/aws/EC2.png"
    - id: aws_ecs
      url: "icons/aws/ElasticContainerService.png"

  node_types:
    - id: lambda_func
      attrs:
        ticks: 2
        template_ref: cloud_card
        icon: aws_lambda
        params:
          icon: "aws_lambda"
          accent_color: "#ec7211"
          role: "AWS Lambda"
          status_bg: "#fff7ed"
          status_color: "#c2410c"
          status_text: "SERVERLESS // ACTIVE"
      fn: |
        fn on_init() {
          state.invocations = 0;
        }
        fn on_timer() {}
        fn on_msg(from, msg) {
          state.invocations += 1;
          log("Lambda " + node_name + " invoked (" + state.invocations + "): " + msg);
          if links.len() > 0 {
            send(links[0], #{
              source: node_name,
              data: msg,
              invocations: state.invocations
            });
          }
        }

    - id: ec2_instance
      attrs:
        ticks: 2
        template_ref: cloud_card
        icon: aws_ec2
        params:
          icon: "aws_ec2"
          accent_color: "#ea580c"
          role: "EC2 Instance"
          status_bg: "#ecfdf5"
          status_color: "#047857"
          status_text: "t4g.xlarge // RUNNING"
      fn: |
        fn on_init() {
          state.req_count = 0;
        }
        fn on_timer() {}
        fn on_msg(from, msg) {
          state.req_count += 1;
          log("EC2 " + node_name + " processed request #" + state.req_count);
          if links.len() > 0 {
            send(links[0], msg);
          }
        }

    - id: ecs_service
      attrs:
        ticks: 2
        template_ref: cloud_card
        icon: aws_ecs
        params:
          icon: "aws_ecs"
          accent_color: "#ea580c"
          role: "ECS Service"
          status_bg: "#f0fdf4"
          status_color: "#15803d"
          status_text: "TASKS 3/3 HEALTHY"
      fn: |
        fn on_init() {
          state.tasks = 3;
        }
        fn on_timer() {}
        fn on_msg(from, msg) {
          if links.len() > 0 {
            send(links[0], msg);
          }
        }
