fns:
  - &ping_fn |
      fn on_init() {}
      fn on_timer() {
        log("ping sending");
        send("pong", #{ type: "PING", display: "PING" });
      }
      fn on_msg(msg) {
        log("ping got: " + msg.type);
      }

  - &pong_fn |
      fn on_init() {}
      fn on_msg(msg) {
        log("pong got: " + msg.type);
        send("ping", #{ type: "PONG", display: "PONG" });
      }

graph_defn:
  graph:
    - name: ping
      node_type: ping
      links: [pong]
    - name: pong
      node_type: pong
      links: [ping]
  graph_attrs:
    title: Nodes Talking To Each Other
  node_types:
    - id: ping
      fn: *ping_fn
      attrs:
        ticks: 4
    - id: pong
      fn: *pong_fn
      attrs:
        ticks: 3600
