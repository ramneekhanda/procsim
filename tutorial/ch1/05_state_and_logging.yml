fns:
  - &counter_fn |
      fn on_init() {
        state.count = 0;
        state.failures = 0;
      }
      fn on_timer() {
        state.count += 1;
        if random_chance(30) {
          state.failures += 1;
          log("tick " + state.count + " - simulated failure (" + state.failures + " so far)");
        } else {
          log("tick " + state.count + " - ok");
        }
      }

graph_defn:
  graph:
    - name: counter
      node_type: counter
      links: []
  graph_attrs:
    title: State and Logging
  node_types:
    - id: counter
      fn: *counter_fn
      attrs:
        ticks: 4
