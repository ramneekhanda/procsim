fns:
  - &client_fn |
    fn on_init() {
      state.seq = 0;
    }
    fn on_timer() {
      state.seq += 1;
      send("worker", #{ id: state.seq });
    }

  - &worker_fn |
    fn on_init() {
      state.queue = [];
      redraw_meter(state.queue.len());
    }
    fn on_msg(msg) {
      state.queue.push(msg.id);
      redraw_meter(state.queue.len());
    }
    fn on_timer() {
      if state.queue.len() > 0 {
        let item = state.queue.remove(0);
        log("Worker processed item #" + item);
      }
      redraw_meter(state.queue.len());
    }
    fn redraw_meter(count) {
      let color = if count >= 3 { "#ef4444" } else if count > 0 { "#f59e0b" } else { "#10b981" };
      let bar_w = if count * 20 > 90 { 90.0 } else { (count * 20) * 1.0 };
      // radius must stay under half of both w and h, or lyon's rounded-rect
      // tessellator hits a degenerate (zero-length) edge and panics - bar_w
      // can be 0 when the queue is empty, so this can't just be a constant.
      let fill_radius = (bar_w / 2.0).min(3.0);
      // Offset clear of the default icon + name label every node still gets
      // underneath a draw() overlay (see 3.1's CARD_Y comment).
      let CARD_Y = 80;
      draw([
        #{ shape: "rect", w: 140, h: 60, radius: 8, y: CARD_Y, fill: "#ffffff", stroke: color, stroke_width: 2 },
        #{ shape: "text", text: "Buffer: " + count + " items", y: CARD_Y + 12, color: "#1e293b", size: 11 },
        #{ shape: "rect", w: 90, h: 8, radius: 3, y: CARD_Y - 8, fill: "#e2e8f0" },
        #{ shape: "rect", w: bar_w, h: 8, radius: fill_radius, x: (bar_w - 90.0) / 2.0, y: CARD_Y - 8, fill: color }
      ]);
    }

graph_defn:
  layout:
    type: hierarchical
    direction: lr
    rank_sep: 240
    node_sep: 110
  graph_attrs:
    title: "Live State Gauges & Buffer Meters"
  node_types:
    - id: client
      fn: *client_fn
      attrs: { ticks: 4 }
    - id: worker
      fn: *worker_fn
      attrs: { ticks: 3 }
  graph:
    - name: client
      node_type: client
      links: [worker]
    - name: worker
      node_type: worker
      links: []
