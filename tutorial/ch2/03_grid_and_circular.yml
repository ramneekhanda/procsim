fns:
  - &leader_fn |
    fn on_init() {
      state.token = 0;
    }
    fn on_timer() {
      state.token += 1;
      log(`Leader origin passing token #${state.token}`);
      send(links[0], #{ token: state.token, hops: 0 });
    }
    fn on_msg(msg) {
      log(`Token #${msg.token} completed full ring circuit (${msg.hops} hops)!`);
    }

  - &ring_node_fn |
    fn on_msg(msg) {
      msg.hops += 1;
      log(`Relaying token #${msg.token} to ${links[0]}`);
      send(links[0], msg);
    }

layout:
  type: circular

graph_defn:
  graph_attrs:
    title: 6-Node Circular Token Ring

  node_types:
    - id: leader
      fn: *leader_fn
      attrs:
        ticks: 5
    - id: node
      fn: *ring_node_fn

  graph:
    - name: node_1
      node_type: leader
      links: [node_2]

    - name: node_2
      node_type: node
      links: [node_3]

    - name: node_3
      node_type: node
      links: [node_4]

    - name: node_4
      node_type: node
      links: [node_5]

    - name: node_5
      node_type: node
      links: [node_6]

    - name: node_6
      node_type: node
      links: [node_1]
