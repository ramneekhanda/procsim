fns:
  - &server_fns |
    fn on_init() {
        globals.x = 1;
        globals.served = 0;
        draw([ #{ shape: "text", x: 0, y: 44, text: "served 0", size: 10, color: "#333333" } ]);
    }

    fn on_timer() {
    }

    fn on_msg(msg) {
        globals.served += 1;
        send(msg.from, #{
            display: "pong: " + msg.ping_id,
            ping_id: msg.ping_id,
            icon: "message_icon"
        });
        draw([ #{ shape: "text", x: 0, y: 44, text: "served " + globals.served, size: 10, color: "#333333" } ]);
    }

  - &client_fns |
    fn on_init() {
        globals.i = 1;
        draw([ #{ shape: "text", x: 0, y: 44, text: "sent 0", size: 10, color: "#333333" } ]);
    }

    fn on_timer() {
        send("server", #{
            display: "ping: " + globals.i,
            ping_id: globals.i,
            icon: "message_icon"
        });
        draw([ #{ shape: "text", x: 0, y: 44, text: "sent " + globals.i, size: 10, color: "#333333" } ]);
        globals.i += 1;
    }

    fn on_msg(msg) {
    }

graph_defn:
  graph:
    - name: server
      node_type: server
      links: [client]
    - name: client
      node_type: client
      links: [server]
  graph_attrs:
    background: "#FFFFFF"
    connection_color: "#000000"
    text_color: "#000000"
    title: some graph
  icons:
    - id: server_icon
      url: https://raw.githubusercontent.com/awslabs/aws-icons-for-plantuml/main/dist/Database/Aurora.png
    - id: message_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/2709.png
  node_types:
    - id: server
      fn: *server_fns
      params:
        - name: BooleanParam
          type: Bool
          default: false
      attrs:
        ticks: 5
        icon: server_icon

    - id: client
      fn: *client_fns
      params:
        - name: BooleanParam
          type: Bool
          default: false
      attrs:
        ticks: 5
        icon: server_icon
