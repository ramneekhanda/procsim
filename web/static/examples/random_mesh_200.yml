fns:
  - &peer_fn |
      fn on_init() {
          globals.sent = 0;
          globals.received = 0;
      }

      fn on_timer() {
          if links.len() == 0 { return; }
          let idx = random_int(0, links.len());
          let peer = links[idx];
          globals.sent += 1;
          send(peer, #{
              display: "#" + globals.sent,
              icon: "message_icon"
          });
      }

      fn on_msg(msg) {
          globals.received += 1;
      }

