fns:
  - &client_fn |
    // Status ring: green = closed (calls flow), amber = half-open (probing),
    // red = open (calls skipped) - plus a fail-count/cooldown label.
    fn viz(state, fail_count, cooldown) {
      let col = "#3fae49";
      if state == "half_open" { col = "#e8b33a"; }
      if state == "open" { col = "#d1453b"; }
      let lbl = state;
      if state == "open" { lbl = state + " (" + cooldown + ")"; }
      else if fail_count > 0 { lbl = state + " (" + fail_count + " fail)"; }
      draw([
        #{ shape: "circle", x: 0, y: 0, r: 40, stroke: col, stroke_width: 3 },
        #{ shape: "text", x: 0, y: 46, text: lbl, size: 9, color: "#333333" }
      ]);
    }
    fn on_init() {
      globals.state = "closed";
      globals.fail_count = 0;
      globals.cooldown = 0;
      viz("closed", 0, 0);
    }
    fn on_timer() {
      if globals.state == "open" {
        globals.cooldown -= 1;
        if globals.cooldown <= 0 {
          globals.state = "half_open";
          log("circuit half-open, probing backend...");
        } else {
          log("circuit open, skipping call (" + globals.cooldown + " ticks left)");
          viz(globals.state, globals.fail_count, globals.cooldown);
          return;
        }
      }
      send("backend", #{
        display: "request",
        icon: "request_icon"
      });
      viz(globals.state, globals.fail_count, globals.cooldown);
    }
    fn on_msg(msg) {
      if msg.ok {
        globals.fail_count = 0;
        if globals.state == "half_open" {
          globals.state = "closed";
          log("backend recovered, circuit closed");
        }
      } else {
        globals.fail_count += 1;
        log("call failed (" + globals.fail_count + " in a row)");
        if globals.fail_count >= 3 {
          globals.state = "open";
          globals.cooldown = 3;
          log("circuit opened after 3 failures");
        }
      }
      viz(globals.state, globals.fail_count, globals.cooldown);
    }

  - &backend_fn |
    fn viz(is_healthy) {
      let col = "#3fae49";
      if !is_healthy { col = "#d1453b"; }
      draw([ #{ shape: "circle", x: 30, y: 30, r: 6, fill: col, stroke: "#1b3a5c", stroke_width: 1 } ]);
    }
    fn on_init() {
      viz(true);
    }
    fn on_msg(msg) {
      if healthy {
        send(msg.from, #{ display: "ok", ok: true, icon: "response_icon" });
      } else {
        send(msg.from, #{ display: "error", ok: false, icon: "error_icon" });
      }
      viz(healthy);
    }

graph_defn:
  graph:
    - name: client
      node_type: client
      links: [backend]
    - name: backend
      node_type: backend
      links: []
  graph_attrs:
    background: "#FFFFFF"
    connection_color: "#000000"
    text_color: "#000000"
    title: Circuit Breaker
  icons:
    - id: client_icon
      url: https://raw.githubusercontent.com/awslabs/aws-icons-for-plantuml/main/dist/Containers/EKSAnywhere.png
    - id: backend_icon
      url: https://raw.githubusercontent.com/awslabs/aws-icons-for-plantuml/main/dist/Database/Aurora.png
    - id: request_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/2709.png
    - id: response_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/2705.png
    - id: error_icon
      url: https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.1/assets/72x72/274c.png
  node_types:
    - id: client
      fn: *client_fn
      attrs:
        ticks: 3
        icon: client_icon
    - id: backend
      fn: *backend_fn
      params:
        - name: healthy
          type: Bool
          default: true
      attrs:
        ticks: 30
        icon: backend_icon
