[env]
CARGO_PROFILE = "release"
CARGO_BUILD = "RUSTC=\"$(rustup which rustc)\" cargo build --release --target wasm32-unknown-unknown"
WASM_BUILD = "PATH=\"$HOME/.cargo/bin:$PATH\" wasm-bindgen --no-typescript --target web --out-dir ./package/wasm/ --out-name dsa ./target/wasm32-unknown-unknown/release/dsa.wasm"

[env.development]
CARGO_PROFILE = "dev"
CARGO_BUILD = "RUSTC=\"$(rustup which rustc)\" cargo build --profile dev --target wasm32-unknown-unknown"
WASM_BUILD = "PATH=\"$HOME/.cargo/bin:$PATH\" wasm-bindgen --no-typescript --target web --out-dir ./package/wasm/ --out-name dsa ./target/wasm32-unknown-unknown/debug/dsa.wasm"

[tasks.npm-install]
private = true
command = "npm"
args = ["install", "--prefix", "web"]

[tasks.clean-site]
private = true
command = "npm"
args = ["run", "clean"]

[tasks.build]
private = true
command = "cargo"
args = ["build"]

[tasks.build-wasm]
private = true
# `eval` (not a bare `${CARGO_BUILD}`) is required: the shell expands
# `${CARGO_BUILD}` textually and then word-splits the *result* into a flat
# argv without ever re-parsing it as shell source - so `VAR="$(cmd)" cmd`
# prefix syntax and `$(...)` command substitution inside CARGO_BUILD's value
# silently never take effect (the shell tries to exec the literal first
# word, e.g. `RUSTC="$(rustup`, and fails with "not found"). `eval` forces a
# second parse pass over the expanded text, which is what actually makes the
# `RUSTC=... cargo build` invocation work as shell syntax. Same issue and
# fix applies to WASM_BUILD below.
script_runner = "@shell"
script = '''eval "${CARGO_BUILD}"'''

[tasks.wasm-bindgen]
private = true
script_runner = "@shell"
script = '''eval "${WASM_BUILD}"'''
dependencies = ["build-wasm"]

[tasks.ensure-dirs]
private = true
command = "mkdir"
args = ["-p", "./package/release/assets/"]

[tasks.copy-wasm-fonts]
private = true
command = "cp"
args = ["-R", "assets/fonts", "./package/release/assets"]
dependencies = ["ensure-dirs"]

[tasks.build-site]
private = true
command = "npm"
args = ["run", "build", "--prefix", "web/"]
dependencies = ["npm-install"]

[tasks.clean-build]
private = true
command = "cargo"
args = ["build"]
dependencies = ["clean"]

[tasks.test]
private = true
command = "cargo"
args = ["test"]

# following are main tasks
[tasks.clean-test]
dependencies = ["clean", "test"]

[tasks.clean]
command = "cargo"
args = ["clean"]

[tasks.build-wasm-module]
dependencies = ["wasm-bindgen", "copy-wasm-fonts"]

[tasks.build-all]
dependencies = ["build-wasm-module", "build-site"]

[tasks.run]
command = "cargo"
args = ["server", "--path", "./package/release", "--open"]
dependencies = ["build-all"]

[tasks.run-dev]
command = "npm"
args = ["run", "dev", "--prefix", "web/"]
dependencies = ["build-all"]

# Desktop shell (Tauri) wrapping the same SvelteKit + wasm app the browser
# build serves - see web/src-tauri/. Both tasks need the wasm module built
# first (Tauri's own `beforeDevCommand`/`beforeBuildCommand` just run
# `npm run dev`/`build`, which - like a bare `npm run dev` in web/ - can't
# resolve the symlinked wasm import on a clean checkout otherwise).
[tasks.tauri-dev]
command = "npm"
args = ["run", "tauri", "--prefix", "web/", "--", "dev"]
dependencies = ["build-wasm-module"]

[tasks.tauri-build]
command = "npm"
args = ["run", "tauri", "--prefix", "web/", "--", "build"]
dependencies = ["build-all"]
