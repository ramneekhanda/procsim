[workspace]

[package]
name = "dsa"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version = "0.14.0" }
bevy-inspector-egui = "0.25.1"
bevy_egui = "0.28.0"
rand = "0.8.5"
rfd = "0.14.1"
wasm-bindgen-futures = "0.4.37"
egui_code_editor = "0.2.9"
bevy_tweening = "0.11.0"
web-sys = "0.3.64"
bevy_prototype_lyon = { git = "https://github.com/ramneekhanda/bevy_prototype_lyon.git" }
bevy_mod_picking = "0.20"
lyon_algorithms = "1"
serde = "1.0"
serde_yaml = "0.9"
rhai = "1.19.0" 

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[package.metadata.commands]
watch = "cargo watch -x 'run --target wasm32-unknown-unknown --release'"


