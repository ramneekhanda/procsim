[package]
name = "dsa"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version = "0.14.2", default-features = false, features = ["bevy_asset", "bevy_color", "bevy_sprite", "bevy_text", "png", "bevy_render", "bevy_core_pipeline", "webgl2"] }
bevy_egui = {version = "0.29.0", default-features = false, features = ["default_fonts", "open_url", "render"] }
rand = "0.8.5"
bevy_tweening = "0.11.0"
bevy_prototype_lyon = { git = "https://github.com/ramneekhanda/bevy_prototype_lyon.git" }
bevy_mod_picking = {version = "0.20", default-features = false, features = ["backend_sprite"] }
bevy_pancam = "0.12"
lyon_algorithms = "1"
serde = "1.0.209"
serde_yaml = "0.9.34+deprecated"
wasm-bindgen = "0.2.93"
bevy_web_asset = "0.9.0"
lazy_static = "1.5.0"
schemars = "0.8.21"
serde_json = "1.0.128"
# Pinned: winit >0.30.5 has a web-backend regression (rust-windowing/winit#3345 class of
# bug) that panics on load with "created media query doesn't match" on displays using
# fractional devicePixelRatio scaling (e.g. 1.5x). Keep at the version bevy_winit 0.14.2
# originally shipped with until winit fixes this upstream.
winit = "=0.30.5"
# Cross-platform `Instant` (wraps `performance.now()` on wasm32, `std::time::Instant`
# natively) - used for temporary per-system profiling instrumentation, since Bevy's own
# `Time` resource only updates once per frame and can't measure sub-frame durations.
web-time = "1.1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rhai = { version="1.19.0", features=["wasm-bindgen", "sync"] }
# bevy_asset pulls in uuid transitively; newer uuid requires an explicit randomness
# source on wasm32, so pin one explicitly to use the browser's crypto API.
uuid = { version = "1", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rhai = { version="1.19.0", features=["sync"] }

[dev-dependencies]
criterion = "0.5"

# Native-only (see `benches/rhai_state_roundtrip.rs`'s doc comment) - measures the
# node-state round-trip cost in `systems::rhai_engine`'s tick loop. Run with `cargo bench`.
[[bench]]
name = "rhai_state_roundtrip"
harness = false

[profile.release]
lto = true
opt-level = 'z'
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1
debug = true

[profile.dev.package."*"]
opt-level = 'z'

# winit 0.30.5's web backend has a `debug_assert!` in resize_scaling.rs that trips on
# fractional devicePixelRatio (e.g. a 1.5x-scaled display): it builds a
# `(resolution: 1.5dppx)` media query the browser reports as not matching 1.5, and
# panics during window creation. Release builds compile the assert out; this keeps dev
# builds usable on such displays without turning off debug-assertions globally.
[profile.dev.package.winit]
debug-assertions = false

[package.metadata.commands]
watch = "cargo watch -x 'run --target wasm32-unknown-unknown --release'"

[dependencies.web-sys]
version = "0.3.70"
features = [
  'Window',
  'HtmlDivElement',
  "CanvasRenderingContext2d",
  "HtmlCanvasElement",
  "CustomEvent",
  "CustomEventInit",
]
