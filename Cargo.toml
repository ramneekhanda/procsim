[package]
name = "dsa"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version = "0.14.1", default-features = false, features = ["bevy_animation", "bevy_asset", "bevy_color", "bevy_sprite", "bevy_text", "png", "bevy_render", "webgl2"] }
bevy_egui = {version = "0.29.0", default-features = false, features = ["default_fonts", "open_url", "render"] }
rand = "0.8.5"
rfd = "0.14.1"
wasm-bindgen-futures = "0.4.43"
egui_code_editor = "0.2.9"
bevy_tweening = "0.11.0"
bevy_prototype_lyon = { git = "https://github.com/ramneekhanda/bevy_prototype_lyon.git" }
bevy_mod_picking = {version = "0.20", default-features = false, features = ["backend_sprite"] }
lyon_algorithms = "1"
serde = "1.0.209"
serde_yaml = "0.9.34+deprecated"
rhai = { version="1.19.0", features=["wasm-bindgen", "sync"] }
wasm-bindgen = "0.2.92"
bevy_web_asset = "0.9.0"
lazy_static = "1.5.0"
schemars = "0.8.21"
serde_json = "1.0.127"
derivative = "2.2.0"

[profile.release]
lto = false
opt-level = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 1

[package.metadata.commands]
watch = "cargo watch -x 'run --target wasm32-unknown-unknown --release'"

[dependencies.web-sys]
version = "0.3.70"
features = [
  'Window',
  "CanvasRenderingContext2d",
  "HtmlCanvasElement",
]
