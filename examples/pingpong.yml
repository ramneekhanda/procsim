fns:
    - &server_fns |
        fn on_init() {
            globals.x = 1;
        }

        fn on_timer() {
        }

        fn on_msg(msg) {
            send(msg.from, #{
                display: "pong: " + msg.ping_id,
                ping_id: msg.ping_id
            });
        }

    - &client_fns |
        fn on_init() {
            globals.i = 1;
        }

        fn on_timer() {
            send("server", #{
                display: "ping: " + globals.i,
                ping_id: globals.i
            });
            globals.i += 1; 
        }

        fn on_msg(msg) {
        }

graph_defn: 
  graph:
    - name: server
      node_type: server
      links: [client]
    - name: client
      node_type: client
      links: [server]
  graph_attrs:
    background: "#D3D3D3"
    connection_color: "#000000"
    text_color: "#000000"
    title: some graph
  node_types:
    - id: server
      fn: *server_fns
      params:
        - name: BooleanParam
          type: Bool
          default: false
      attrs:
        ticks: 5
        icon: https://raw.githubusercontent.com/awslabs/aws-icons-for-plantuml/main/dist/Database/Aurora.png

    - id: client
      fn: *client_fns
      params:
        - name: BooleanParam
          type: Bool
          default: false
      attrs:
        ticks: 5
        icon: https://raw.githubusercontent.com/awslabs/aws-icons-for-plantuml/main/dist/Database/Aurora.png
    
    
   