fns:
  - &server_fn |
      def handle_event(context):
        log("hello server")

  - &client_fn |
      def handle_event(context):
        log("hello client")

graph_defn:
  name: "test graph"
  nodes:
    - name: server
      id: server
      fn: *server_fn
      attrs:
        tick: 5
        color: [1., 0., 1., 1.]
    - name: client1
      id: client1
      fn: *client_fn
      attrs:
        ticks: 10
        color: [1., 1., 0., 0.]
    - name: client2
      id: client2
      fn: *client_fn
  allowed_connections:
    server: [client1, client2]
  graph:
    server: [client1, client2]
  graph_attrs:
      title: "A Sample Graph!"
      